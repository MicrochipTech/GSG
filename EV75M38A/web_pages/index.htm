<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMA7D65 Curiosity Pro</title>
    <link rel="icon" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #e52e2e 0%, #c41e1e 100%);
            color: white;
            padding: 30px;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 253px;
            height: 66px;
            margin-right: 30px;
            background: white;
            padding: 10px 20px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            max-width: 100%;
            height: auto;
        }

        h1 {
            flex: 1;
			text-align: center;
			font-size: 2.5em;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .content {
            padding: 20px;
			padding-top: 10px;
        }

        /* the .top div always stays on top */
        .top {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
			font-size: 1.1em;
            color:red;
        }

        /* container for the 2 columns */
        .columns {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        .column-left {
            flex: 1;
            min-width: 300px;
			padding-top: 20px;
        }

        .column-left img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
            border: 1px solid #e0e0e0;
        }

        .column-left img:hover {
            transform: scale(1.02);
        }

		.user-row {
			display: flex;
			align-items: center;   /* aligne verticalement */
			gap: 20px;             /* espace entre le h2 et le bouton */
			margin: 10px 0;
		}

		.user-row h2 {
			margin: 0;             /* retire la marge par défaut du h2 */
			padding-top: 4px;
		}
		
        #column-right {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #column-right h2 {
            color: #e52e2e;
            font-size: 1.8em;
            margin-bottom: 10px;
            font-weight: 400;
        }

        #column-right p {
            color: #4a5568;
            line-height: 1.4;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        #column-right ul {
            list-style-position: inside;
            padding-left: 0;
        }

        #column-right li {
            color: #4a5568;
            line-height: 1.4;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        #column-right a {
            color: #000000;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        #column-right a:hover {
            color: #c41e1e;
            text-decoration: underline;
        }

        #column-right .leds {
            font-size: 2em;
        }

        #column-right .leds a {
            color: #ddd;
            cursor: pointer;
        }

        #column-right .leds a:hover {
            color: #ddd;
            text-decoration: none;
        }

		#column-right input[type="checkbox"] {
			appearance: none;
			-webkit-appearance: none;
			width: 22px;
			height: 22px;
			border: 2px solid #ccc;
			border-radius: 4px;
			vertical-align: middle;
			margin-right: 8px;
			cursor: pointer;
			position: relative;
			transition: all 0.2s ease;
		}

		#column-right input[type="checkbox"]:checked {
			background-color: #e52e2e;
			border-color: #c41e1e;
		}

		#column-right input[type="checkbox"]:checked::after {
			content: "✔";
			position: absolute;
			color: white;
			font-size: 16px;
			left: 3px;
			top: -1px;
		}

		/* BLUE LED */
		#column-right input.led-blue:checked {
			background-color: #2D29FF;
			border-color: #1B1ACF;
		}

		/* RED LED */
		#column-right input.led-red:checked {
			background-color: #FF292C;
			border-color: #C41E1E;
		}

		/* GREEN LED */
		#column-right input.led-green:checked {
			background-color: #009900;
			border-color: #007700;
		}

		/* Optionnel : survol */
		#column-right input[type="checkbox"]:hover {
			border-color: #888;
		}

		#column-right label {
			font-size: 1.1em;
			color: #333;
		}

		#board-button {
			display: inline-block;
			width: 80px;
			padding: 5px 0;
			margin: 5px;
			background: linear-gradient(#f0f0f0, #ccc);
			border: 2px solid #888;
			border-radius: 12px;
			text-align: center;
			font-weight: bold;
			box-shadow: 0 5px 0 #888;
			cursor: default;
			transition: all 0.1s ease-in-out;
			user-select: none;
		}

		#board-button.pressed {
			box-shadow: 0 2px 0 #555;
			background: linear-gradient(#bbb, #999);
			transform: translateY(3px);
		}

        @media (max-width: 768px) {
            h1 {
                font-size: 1.6em;
            }

            .columns {
                flex-direction: column;
            }
        }


.dot {
    height: 10px;
    width: 10px;
    background-color: #4caf50;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%   { opacity: 1; }
    50%  { opacity: 0.2; }
    100% { opacity: 1; }
}




    </style>

    <script src="/mchp.js" type="text/javascript"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="microchip_logo_horizontal.png" alt="Microchip Logo">
            </div>
            <h1>SAMA7D65 Curiosity Pro</h1>
        </header>

        <div class="content">
            <div class="top">
    <span class="dot"></span>
    Web Server is Online
            </div>

            <div class="columns">
                <div class="column-left">
                    <img src="board_photo.png" alt="SAMA7D65 Curiosity Pro Board">
                </div>

                <div id="column-right">
                    <h2>"RGB LED" control:</h2>
					<p>
						<label>
							<input type="checkbox" id="led1" class="led-red" onchange="toggleLed(1, this.checked)">
							Red
						</label>
						&nbsp;&nbsp;
						<label>
							<input type="checkbox" id="led0" class="led-green" onchange="toggleLed(0, this.checked)">
							Green
						</label>
						&nbsp;&nbsp;
						<label>
							<input type="checkbox" id="led2" class="led-blue" onchange="toggleLed(2, this.checked)">
							Blue
						</label>
					</p>

                    <div class="user-row">
						<h2>"USER" button feedback:</h2>
						<div id="board-button" class="button-up">USER</div>
					</div>
                    <h2>Resources</h2>
                    <ul>
                        <li><a>Curiosity Pro User Guide</a></li>
                        <li><a href="https://www.microchip.com/en-us/development-tool/EV75M38A" target="_blank">Curiosity Pro web page</a></li>
						<li><a href="https://www.microchip.com/en-us/product/sama7d65" target="_blank">MPU Family web page</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

<script type="text/javascript">
function updateStatus(xmlData) {
	if(!xmlData) return;

    // Update the visual state of the LED
    for (let i = 0; i <= 2; i++) {
        let value = getXMLValue(xmlData, 'led' + i);
        let checked = (value == '1');
        document.getElementById('led' + i).checked = checked;
    }
	
	let btnState = getXMLValue(xmlData, 'btn0') === 'up';
	updateButtonState(!btnState);  // true if pressed, false if not pressed
}
setTimeout("newAJAXCommand('status.xml', updateStatus, true)", 500);

function toggleLed(ledIndex, isChecked) {
    // Converts the box state in 1 (ON) or 0 (OFF)
    var state = isChecked ? 1 : 0;

    // Sends the CGI command to the webserver
    newAJAXCommand('leds.cgi?led=' + ledIndex + '&state=' + state);
}

function updateButtonState(isPressed) {
    const btn = document.getElementById("board-button");
    btn.classList.toggle("pressed", isPressed);
}
</script>
</body>
</html>
